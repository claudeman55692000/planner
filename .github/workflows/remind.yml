name: Study reminders

on:
  schedule:
    - cron: '*/10 * * * *'   # checks every 10 minutes; each assignment sends at its own time
  workflow_dispatch:         # lets you run it by hand to test (sends everything due now)

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('assignments.json', 'utf8'));
            const tz = 'America/Chicago';
            const parts = Object.fromEntries(
              new Intl.DateTimeFormat('en-CA', {
                timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'})
                .formatToParts(new Date()).map(p => [p.type, p.value]));
            const today = `${parts.year}-${parts.month}-${parts.day}`;
            const nowMin = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
            const manual = context.eventName !== 'schedule';

            const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + (m || 0); };
            const epoch = s => {
              const [yy, mm, dd] = s.split('-').map(Number);
              return Math.floor(Date.UTC(yy, mm - 1, dd) / 864e5);
            };
            const WINDOW = {test: 7, quiz: 4, project: 10, homework: 2, other: 3};
            const days = due => epoch(due) - epoch(today);
            const onDay = a => {
              if (a.freq !== 'every2') return true;
              return a.due ? days(a.due) % 2 === 0 : epoch(today) % 2 === 0;
            };
            const nm = d.name || 'friend';
            const cheer = typeof d.cheer === 'number' ? d.cheer : 5;
            const clsName = id => ((d.classes || []).find(c => c.id === id) || {}).name;
            const hasDays = a => a.days && Object.keys(a.days).length > 0;
            const timeOf = a => (hasDays(a) && a.days[today]) || a.time || (d.settings || {}).time || '16:00';

            function message(a) {
              const dl = a.due ? days(a.due) : null;
              const cn = clsName(a.classId) ? ` (${clsName(a.classId)})` : '';
              const sub = a.subtitle ? ` - ${a.subtitle}` : '';
              const when = dl === null ? '' : dl === 0 ? 'today' : dl === 1 ? 'tomorrow' : `in ${dl} days`;
              const kind = {test: 'Test', quiz: 'Quiz', homework: 'Homework due', project: 'Project due'}[a.type] || 'Due';
              if (dl === null) {
                if (cheer === 0) return `${a.title}${sub}${cn}: no due date.`;
                if (cheer === 1) return `Reminder: ${a.title}${sub}${cn}.`;
                if (cheer <= 3) return `Hi ${nm}, a quick reminder about ${a.title}${sub}${cn}. Mark it done when you've finished.`;
                return `Hey ${nm}! Quick reminder about ${a.title}${sub}${cn}. Tap done in the planner when you've finished it!`;
              }
              if (cheer === 0) return `${a.title}${sub}${cn}: ${kind.toLowerCase()} ${when}.`;
              if (cheer === 1) return `Reminder: ${a.title}${sub}${cn}. ${kind} ${when}.`;
              if (cheer <= 3) {
                switch (a.type) {
                  case 'test': return `Time to study for ${a.title}${cn}, ${nm}. Test ${when}. You've got this.`;
                  case 'quiz': return `Quiz ${when}: ${a.title}${cn}. A little review will help, ${nm}.`;
                  case 'homework': return `Homework due ${when}: ${a.title}${cn}. Let's get it done, ${nm}.`;
                  case 'project': return `Time to work on "${a.title}"${sub}${cn}. Due ${when}.`;
                  default: return `${a.title}${sub}${cn}: due ${when}. You're doing well, ${nm}.`;
                }
              }
              let s;
              switch (a.type) {
                case 'test': s = `Study time, ${nm}! You've got this! Go over the unit review for ${a.title}${cn}. Test ${when}.`; break;
                case 'quiz': s = `Quiz ${when}: ${a.title}${cn}. A little review goes a long way, ${nm}!`; break;
                case 'homework': s = `Homework due ${when}: ${a.title}${cn}. Let's knock it out, ${nm}!`; break;
                case 'project': s = `Let's work on "${a.title}"${sub}${cn}! Due ${when}. One step at a time, ${nm}!`; break;
                default: s = `${a.title}${sub}${cn}: due ${when}. You're doing great, ${nm}!`;
              }
              return cheer === 5 ? s + ' You are going to crush it!' : s;
            }

            const list = (d.assignments || []).filter(a => {
              if (a.done) return false;
              if (hasDays(a)) return a.days[today] !== undefined;
              if (!onDay(a)) return false;
              if (!a.due) return true;
              const dl = days(a.due);
              return dl >= 0 && dl <= (WINDOW[a.type] || 3);
            });

            const {owner, repo} = context.repo;
            const since = new Date(Date.now() - 3 * 864e5).toISOString();
            const recent = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'all', since, per_page: 100});
            const bodies = recent.filter(i => !i.pull_request).map(i => i.body || '');

            // tidy up: close reminder issues from earlier days
            const open = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'open', per_page: 100});
            for (const i of open) {
              const b = i.body || '';
              const mine = i.title.startsWith('Study reminders') || b.includes('<!-- sr-issue -->');
              if (!i.pull_request && mine && !b.includes(`<!-- sr:${today}:`)) {
                await github.rest.issues.update({owner, repo, issue_number: i.number, state: 'closed'});
              }
            }

            let sent = 0;
            for (const a of list) {
              if (!manual && nowMin < toMin(timeOf(a))) continue;
              const key = `<!-- sr:${today}:${a.id} -->`;
              if (!manual && bodies.some(b => b.includes(key))) continue;
              await github.rest.issues.create({
                owner, repo,
                title: `Reminder: ${a.title}`,
                body: `@${owner}\n\n${message(a)}\n\n<!-- sr-issue -->\n${key}`
              });
              sent++;
            }
            core.info(`Sent ${sent} reminder(s).`);
