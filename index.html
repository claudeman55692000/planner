<title>Study Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Comic+Neue:wght@400;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{--ink:#1b1b2f;--glass:rgba(255,255,255,.88);--acc:#4f46e5;--acc2:#ec4899;--ok:#16a34a;--bad:#dc2626;--planner-font:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--planner-font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);color:var(--ink);min-height:100vh;background:linear-gradient(135deg,#6366f1,#ec4899)}
button,input,select,textarea{font-family:inherit}
#app{max-width:640px;margin:0 auto;padding:16px 14px 100px}
h1{margin:0;font-size:26px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
h2{font-size:18px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.sub{color:#fff;opacity:.95;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.card{background:var(--glass);backdrop-filter:blur(8px);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:#e5e7eb;color:var(--ink)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600}
button.big{width:100%;padding:16px;font-size:17px;margin-bottom:10px}
button.ghost{background:rgba(255,255,255,.25);color:#fff}
button.danger{background:#fee2e2;color:var(--bad)}
button.ok{background:#dcfce7;color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;margin:3px 4px 3px 0;color:#fff}
.academic{background:#4f46e5}.other{background:#ea580c}
.t-test{background:#dc2626}.t-quiz{background:#d97706}.t-homework{background:#2563eb}.t-project{background:#7c3aed}.t-other{background:#6b7280}
.asg{cursor:pointer}
.asg.done{opacity:.55}
.asg .title{font-weight:700;font-size:16px}
.small{font-size:13px;color:#4b5563}
.late{color:var(--bad);font-weight:700}
.soon{color:#b45309;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.box h3{margin:0 0 12px}
.box button{width:100%;margin-bottom:8px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:10px;background:#fff}
textarea{min-height:90px}
label{font-size:13px;color:#4b5563;display:block;margin-bottom:3px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:rgba(255,255,255,.35);color:#fff}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.walls button{height:50px;padding:0;margin:0;border:2px solid #fff;box-shadow:0 0 0 1px #d1d5db}
#toasts{position:fixed;left:0;right:0;top:10px;z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:14px;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto}
.empty{text-align:center;color:#4b5563;padding:10px}
.zippy-dock{position:fixed;right:18px;bottom:18px;z-index:45;display:flex;align-items:flex-end;gap:10px}
.zippy-face{width:76px;height:76px;padding:0;border:4px solid #111;border-radius:50%;display:grid;place-items:center;font-size:42px;box-shadow:0 6px 18px #0004;overflow:visible}
.zippy-bubble{max-width:min(260px,calc(100vw - 130px));padding:12px 14px;border:2px solid #111;border-radius:16px;background:#fff;color:#111;box-shadow:0 6px 18px #0003;font-size:14px}
.zippy-bubble[hidden]{display:none}
.zippy-dock.is-speaking .zippy-face{animation:zippy-bounce var(--zippy-bounce-duration,.55s) ease-in-out 2}
.zippy-face .buddy-art{width:64px;height:64px;display:block;overflow:visible}
.buddy-settings{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:8px 0 16px;background:#fafaff}
.buddy-settings h4{font-size:17px;margin:0 0 12px;color:#312e81}
.buddy-section-title{margin:10px 0 6px;font-size:14px;font-weight:700;color:#374151}
.buddy-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.font-picker{display:grid;gap:8px;margin:6px 0 12px}
.box .font-option{width:100%;margin:0;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#f3f4f6;border:2px solid transparent}
.box .font-option.selected{border-color:var(--acc);background:#eef2ff}
.font-option:focus-visible{outline:3px solid #818cf8;outline-offset:2px}
.font-option-name{font-size:15px;font-weight:700;margin-bottom:4px}
.font-option-preview{font-size:16px;line-height:1.4;color:#374151}
.box .buddy-option{width:auto;margin:0;padding:7px;display:flex;align-items:center;gap:8px;text-align:left;background:#f3f4f6;border:2px solid transparent;min-width:0}
.box .buddy-option.selected{border-color:var(--acc);background:#eef2ff}
.buddy-option:focus-visible{outline:3px solid #818cf8;outline-offset:2px}
.buddy-option .buddy-art{width:44px;height:44px;flex:none}
.buddy-option-name{font-size:12px;font-weight:650;line-height:1.2}
.buddy-emoji{font-size:34px;width:44px;flex:none;text-align:center}

/* Character animation layers */
.buddy-art{transform-origin:50% 70%;animation:buddy-idle 2.4s ease-in-out infinite}
.buddy-art.motion-1{animation-duration:2.9s}
.buddy-art.motion-2{animation-name:buddy-sway;animation-duration:2.2s}
.buddy-art.motion-3{animation-name:buddy-pulse;animation-duration:2.6s}
.buddy-art .buddy-aura{transform-box:fill-box;transform-origin:center;animation:aura-pulse 2.2s ease-in-out infinite}
.buddy-art .buddy-spark{transform-box:fill-box;transform-origin:center;animation:sparkle 1.8s ease-in-out infinite}
.buddy-art .buddy-spark.delay{animation-delay:.9s}
.buddy-art .buddy-hair{transform-box:fill-box;transform-origin:50% 100%;animation:hair-sway 2.8s ease-in-out infinite}
.buddy-art .buddy-body{transform-box:fill-box;transform-origin:50% 100%;animation:body-breathe 2.7s ease-in-out infinite}
.buddy-art .buddy-arm{transform-box:fill-box;transform-origin:50% 15%;animation:arm-sway 2.1s ease-in-out infinite}
.buddy-art .buddy-sword{transform-box:view-box;transform-origin:78px 57px;animation:sword-float 2.3s ease-in-out infinite}
.buddy-art .buddy-sword-glow{animation:sword-glow 1.6s ease-in-out infinite}
.buddy-art .buddy-blink{animation:eye-blink 4.7s linear infinite}
.buddy-art.villain .buddy-aura{animation-duration:3.1s}
.buddy-art.villain .buddy-spark{animation-duration:2.4s}
.buddy-art.animal .buddy-body{animation-duration:2s}
.buddy-option:hover .buddy-art{animation-duration:.7s}
.zippy-dock.is-speaking .zippy-face .buddy-art{animation-duration:.55s}
.zippy-dock.is-speaking .zippy-face .buddy-sword{animation-duration:.6s}
@keyframes buddy-idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1deg)}}
@keyframes buddy-sway{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(-4deg)}70%{transform:translateY(-2px) rotate(4deg)}}
@keyframes buddy-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@keyframes aura-pulse{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.55;transform:scale(1.08)}}
@keyframes sparkle{0%,100%{opacity:.25;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes hair-sway{0%,100%{transform:rotate(0)}35%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}
@keyframes body-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@keyframes arm-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes sword-float{0%,100%{transform:rotate(25deg) translateY(0)}50%{transform:rotate(20deg) translateY(-4px)}}
@keyframes sword-glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes eye-blink{0%,46%,50%,100%{opacity:0}47%,49%{opacity:1}}
@keyframes zippy-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px) rotate(-5deg)}}
@media(max-width:380px){.buddy-picker{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.zippy-dock.is-speaking .zippy-face,.buddy-art,.buddy-art *{animation:none!important}}
.zippy-menu-backdrop{
  position:fixed;
  inset:0;
  z-index:110;
  display:grid;
  place-items:center;
  padding:16px;
  background:rgba(10,10,30,.55);
}

.zippy-menu{
  width:min(100%,360px);
  padding:18px;
  border-radius:18px;
  background:#fff;
  box-shadow:0 10px 35px #0005;
}

.zippy-menu h3{margin:0 0 8px}
.zippy-menu p{margin:0 0 14px}
.zippy-menu button{
  display:block;
  width:100%;
  margin:8px 0;
  text-align:left;
}

.highfive-stage{
  position:fixed;
  inset:0;
  z-index:120;
  pointer-events:none;
}

.highfive-caption{
  position:absolute;
  top:7vh;
  left:50%;
  width:min(90vw,540px);
  transform:translateX(-50%);
  padding:14px 18px;
  border:3px solid #111;
  border-radius:18px;
  background:#fff;
  color:#111;
  text-align:center;
  font-size:clamp(18px,4vw,27px);
  font-weight:800;
  box-shadow:0 6px 20px #0005;
}

.highfive-buddy{
  position:absolute;
  top:50%;
  left:50%;
  width:150px;
  height:150px;
  padding:0;
  transform:translate(-50%,-50%);
  border:5px solid #111;
  border-radius:50%;
  background:#ffd84d;
  pointer-events:auto;
  overflow:visible;
  box-shadow:0 8px 30px #0005;
  animation:highfive-arrive .55s ease-out both;
}

.highfive-buddy .buddy-art{width:100%;height:100%}

.highfive-stage.dramatic .highfive-buddy{
  width:clamp(180px,30vw,250px);
  height:clamp(180px,30vw,250px);
  border-width:7px;
  box-shadow:0 0 0 12px #fff8,0 0 55px 25px #ff7b00aa,0 10px 35px #0007;
  animation:dramatic-arrive .85s cubic-bezier(.2,1.5,.4,1) both;
}

.hf-flames{
  position:absolute;
  top:50%;
  left:50%;
  width:min(90vw,440px);
  height:min(90vw,440px);
  transform:translate(-50%,-50%);
  opacity:0;
  pointer-events:none;
}

.dramatic .hf-flames{opacity:1}

.hf-flames span{
  position:absolute;
  bottom:7%;
  left:calc(8% + var(--i)*7%);
  width:22%;
  height:62%;
  border-radius:50% 50% 35% 35%;
  background:linear-gradient(to top,#fff 0%,#ffe342 18%,#ff7b14 48%,#ed3025 72%,transparent 100%);
  filter:blur(3px);
  transform-origin:50% 100%;
  animation:flame-dance .42s ease-in-out infinite alternate;
  animation-delay:calc(var(--i)*-.09s);
}

.hf-flames span:nth-child(even){
  height:48%;
  animation-duration:.31s;
}

.hf-raised-hand{
  position:absolute;
  top:calc(50% - 150px);
  left:calc(50% + 50px);
  z-index:5;
  font-size:clamp(48px,12vw,80px);
  opacity:0;
  transform:rotate(-18deg) scale(.3);
  pointer-events:auto;
  cursor:pointer;
  touch-action:manipulation;
}

.dramatic .hf-raised-hand{
  animation:hand-up .55s 1s ease-out forwards,hand-wave .35s 1.6s ease-in-out infinite alternate;
}

.hf-cracks{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  pointer-events:none;
}

.cracked .hf-cracks{animation:crack-fade 1.8s ease-out forwards}
.level-five.cracked .hf-cracks{animation-duration:3s}
.level-five .hf-cracks path{
  stroke:#111;
  stroke-width:1.6;
  filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 2px #111);
}

.hf-cracks path{
  fill:none;
  stroke:#171717;
  stroke-width:.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 2px white);
}

.hf-flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

.explosion .hf-flash{animation:screen-flash .35s ease-out}

.hf-hit{
  position:absolute;
  top:50%;
  left:50%;
  z-index:4;
  color:#fff;
  font-size:clamp(32px,10vw,64px);
  font-weight:1000;
  text-shadow:3px 3px #111,-2px -2px #111,0 0 18px #ff6b00;
  opacity:0;
  transform:translate(-50%,-50%) scale(.2) rotate(-12deg);
  pointer-events:none;
}

.smacked .hf-hit{animation:hit-pop .7s ease-out forwards}

.hf-thumb{
  position:absolute;
  top:calc(50% - 150px);
  left:calc(50% + 65px);
  z-index:3;
  font-size:clamp(64px,15vw,100px);
  opacity:0;
  transform:scale(.2) rotate(-25deg);
  pointer-events:none;
}

.show-thumb .hf-thumb{animation:thumb-pop .5s ease-out forwards}

.highfive-stage.returning .highfive-buddy{
  animation:buddy-return .8s ease-in-out forwards;
}

.highfive-stage.returning .hf-flames,
.highfive-stage.returning .hf-raised-hand,
.highfive-stage.returning .hf-thumb,
.highfive-stage.returning .highfive-caption{
  opacity:0;
  transition:opacity .45s ease;
}

body.zippy-highfive-active #zippy-dock{visibility:hidden}

@keyframes highfive-arrive{
  from{opacity:0;transform:translate(-50%,-35%) scale(.5)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

@keyframes dramatic-arrive{
  from{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
}

@keyframes flame-dance{
  from{transform:scale(.75,.8) rotate(-12deg);filter:blur(2px)}
  to{transform:scale(1.2,1.18) rotate(12deg);filter:blur(5px)}
}

@keyframes hand-up{
  to{opacity:1;transform:rotate(0) scale(1)}
}

@keyframes hand-wave{
  from{translate:0 0;rotate:-8deg}
  to{translate:0 -10px;rotate:8deg}
}

@keyframes crack-fade{
  0%{opacity:0}
  12%,48%{opacity:1}
  100%{opacity:0}
}

@keyframes screen-flash{
  0%{opacity:.95}
  100%{opacity:0}
}

@keyframes hit-pop{
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(8deg)}
  100%{opacity:0;transform:translate(-50%,-75%) scale(1) rotate(0)}
}

@keyframes thumb-pop{
  to{opacity:1;transform:scale(1) rotate(8deg)}
}

@keyframes buddy-return{
  from{transform:translate(-50%,-50%) scale(1)}
  to{
    transform:
      translate(
        calc(50vw - 56px - 50%),
        calc(50vh - 56px - 50%)
      )
      scale(.35);
  }
}

@media(prefers-reduced-motion:reduce){
  .highfive-stage *,
  .zippy-menu-backdrop *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
  /* Zippy's guided tour */

  position:fixed;
  inset:0;
  z-index:2000;

@media(max-width:420px){

</style>

<body>
<div id="app"></div>
<div id="toasts"></div>
<div class="zippy-dock" id="zippy-dock">
  <div class="zippy-bubble" id="zippy-bubble" role="status" hidden></div>
  <button class="zippy-face" id="zippy-face" type="button" aria-label="Talk to Zippy">😀</button>
</div>
<script>
'use strict';

const KEY='gabe-planner-v1';
const SYNC_KEY='gabe-planner-sync';
const DIGEST_EMAIL_KEY='gabe-planner-email';

function digestEmail(){
  try{return localStorage.getItem(DIGEST_EMAIL_KEY)||''}
  catch(error){return ''}
}

async function scheduleDigestAssignment(assignment){
  const email=digestEmail();
  if(!email||!assignment)return;

  const response=await fetch('https://planner.gabe55692000.workers.dev/schedule',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      id:assignment.id,
      email,
      title:assignment.title,
      course:cls(assignment.classId)?.name||'',
      dueTimestamp:assignment.due
        ?Date.parse(assignment.due+'T12:00:00Z')
        :null
    })
  });
  if(!response.ok)throw new Error('Could not save this email reminder.');
}

async function deleteDigestAssignment(id){
  if(!id)return;

      buddyName:'Zippy',
      buddyColor:'#ffd84d',

      cheer:3,
      font:'atkinson'
    }
  };
}
function normalizeReminder(assignment,defaultTime='16:00'){
  const source=assignment&&assignment.reminder&&typeof assignment.reminder==='object'
    ?assignment.reminder:{};

  return {
    enabled:source.enabled!==false,
    mode:source.mode==='custom'?'custom':'default',
    time:/^\d{2}:\d{2}$/.test(source.time||'')?source.time:defaultTime,
    dates:Array.isArray(source.dates)
      ?[...new Set(source.dates.filter(date=>/^\d{4}-\d{2}-\d{2}$/.test(date)))].sort()
      :[],
    after:['daily','default','stop'].includes(source.after)?source.after:'default'
  };
}

function normalizeAssignment(assignment,defaultTime){
  const item=assignment&&typeof assignment==='object'?assignment:{};
  return {...item,reminder:normalizeReminder(item,defaultTime)};
}
function normalizeData(data){
  const defaults=defaultData();
  const source=data&&typeof data==='object'?data:{};
  const settings=source.settings&&typeof source.settings==='object'?source.settings:{};
  const validFont=FONTS.some(font=>font.id===settings.font)?settings.font:defaults.settings.font;
  return {
    ...source,
    classes:Array.isArray(source.classes)?source.classes:[],
    assignments:Array.isArray(source.assignments)   ?source.assignments.map(item=>normalizeAssignment(item,settings.time||defaults.settings.time))   :[],
    settings:{
      ...defaults.settings,
      ...settings,
      wall:settings.wall&&typeof settings.wall==='object'?settings.wall:defaults.settings.wall,
      time:settings.time||defaults.settings.time,
      buddyName:settings.buddyName||defaults.settings.buddyName,
      buddyColor:settings.buddyColor||defaults.settings.buddyColor,
      buddyDesign:settings.buddyDesign||defaults.settings.buddyDesign,
      cheer:Number.isFinite(Number(settings.cheer))?Number(settings.cheer):defaults.settings.cheer,
      font:validFont
    }
  };
}

/* ---------- GitHub sync ---------- */
function syncCfg(){
  try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}
  catch(e){return {}}
}

function scheduleSync(){
  const cfg=syncCfg();
  if(!cfg.repo||!cfg.token)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false),1500);
}

async function syncNow(verbose){
  const cfg=syncCfg();
  if(!cfg.repo||!cfg.token){
    if(verbose)toast('Add your repo and token in Settings first.');
    return;
  }

  const url=`https://api.github.com/repos/${cfg.repo}/contents/assignments.json`;
  const headers={
    Authorization:'Bearer '+cfg.token,
    Accept:'application/vnd.github+json'
  };

  try{
    let sha;
    const getResponse=await fetch(url,{headers});
    if(getResponse.ok){
      sha=(await getResponse.json()).sha;
    }else if(getResponse.status!==404){
      throw new Error('GitHub said '+getResponse.status+' (check repo name and token)');
    }

    const data={
      name:S.settings.name,
      classes:S.classes,
      assignments:S.assignments,
      settings:{time:S.settings.time,font:S.settings.font},
      updated:new Date().toISOString()
    };
    const body={
      message:'Sync planner',
      content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))
    };
    if(sha)body.sha=sha;

    const putResponse=await fetch(url,{
      method:'PUT',
      headers,
      body:JSON.stringify(body)
    });
    if(!putResponse.ok){
      throw new Error('GitHub said '+putResponse.status+' (token needs Contents: read & write)');
    }
    if(verbose)toast('Synced to GitHub ✓');
  }catch(e){
    toast('Sync failed: '+e.message);
  }
}

/* ---------- modals ---------- */
function modal(build){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');
    overlay.className='overlay';
    const box=document.createElement('div');
    box.className='box';
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    let closed=false;
    const close=value=>{
      if(closed)return;
      closed=true;
      overlay.remove();
      resolve(value);
    };

    overlay.addEventListener('click',event=>{
      if(event.target===overlay)close(null);
    });
    build(box,close);
  });
}

function choose(title,options){
  return modal((box,close)=>{
    box.innerHTML=`<h3>${esc(title)}</h3>`;
    options.forEach(option=>{
      const button=document.createElement('button');
      button.textContent=option.label;
      if(option.cls)button.className=option.cls;
      button.onclick=()=>close(option.value);
      box.appendChild(button);
    });
    const cancel=document.createElement('button');
    cancel.textContent='Cancel';
    cancel.className='danger';
    cancel.onclick=()=>close(null);
    box.appendChild(cancel);
  });
}

function ask(title,placeholder,initial=''){
  return modal((box,close)=>{
    box.innerHTML=`<h3>${esc(title)}</h3><input type="text" placeholder="${esc(placeholder)}" value="${esc(initial)}"><button class="pri">OK</button><button class="danger">Cancel</button>`;
    const input=box.querySelector('input');
    const [ok,cancel]=box.querySelectorAll('button');

    const submit=()=>{
      const value=input.value.trim();
      if(value)close(value);
      else input.focus();
    };

    ok.onclick=submit;
    cancel.onclick=()=>close(null);
    input.addEventListener('keydown',event=>{
      if(event.key==='Enter')submit();
    });
    setTimeout(()=>input.focus(),50);
  });
}

  function timeParts(value){
  const [hour,minute]=String(value||'16:00').split(':').map(Number);
  return {
    hour12:hour%12||12,
    minute:Math.round(minute/10)*10%60,
    period:hour>=12?'PM':'AM'
  };
}

function to24Hour(hour,minute,period){
  const hours=(Number(hour)%12)+(period==='PM'?12:0);
  return String(hours).padStart(2,'0')+':'+
    String(Number(minute)).padStart(2,'0');
}

function timeParts(value){
  const [h = 16, m = 0] =
    String(value || '16:00').split(':').map(Number);

  return {
    hour12: h % 12 || 12,
    minute: m,
    period: h >= 12 ? 'PM' : 'AM'
  };
}

  function reminderModal(initial){
  const reminder=normalizeReminder({reminder:initial},S.settings.time||'16:00');

  return modal((box,close)=>{
    let mode=reminder.mode;
    let dates=[...reminder.dates];
    let after=reminder.after;

    const draw=()=>{
      const parts=timeParts(reminder.time);

      box.innerHTML=`<h3>Reminder schedule</h3>
        <p class="small">Choose this assignment's reminder schedule.</p>

        <button type="button" data-mode="default"
          class="${mode==='default'?'pri':''}">
          Use default
        </button>

        <button type="button" data-mode="custom"
          class="${mode==='custom'?'pri':''}">
          Custom time
        </button>

        <div id="default_schedule" ${mode==='default'?'':'hidden'}>
          <label>Hour</label>
          <select id="r_hour">
            ${Array.from({length:12},(_,i)=>i+1).map(hour =>
              `<option ${hour===parts.hour12?'selected':''}>${hour}</option>`
            ).join('')}
          </select>

          <label>Minute</label>
          <select id="r_minute">
            ${Array.from({length:6},(_,i)=>i*10).map(minute =>
              `<option value="${String(minute).padStart(2,'0')}"
                ${minute===parts.minute?'selected':''}>
                ${String(minute).padStart(2,'0')}
              </option>`
            ).join('')}
          </select>

          <label>AM/PM</label>
          <select id="r_period">
            <option ${parts.period==='AM'?'selected':''}>AM</option>
            <option ${parts.period==='PM'?'selected':''}>PM</option>
          </select>

          <p class="small">Uses the device's local clock and time zone.</p>
        </div>

        <div id="custom_schedule" ${mode==='custom'?'':'hidden'}>
          <label>Choose reminder dates</label>
          <input type="date" id="r_date" min="${todayStr()}">
          <button type="button" id="r_add_date">Add date</button>

          <div id="r_dates"></div>

          <p class="small">
            <strong>After the final selected custom reminder date:</strong>
          </p>

          <label>
            <input type="checkbox" data-after="daily"
              ${after==='daily'?'checked':''}>
            After the final day, remind me each day.
          </label>

          <label>
            <input type="checkbox" data-after="default"
              ${after==='default'?'checked':''}>
            After the final day, remind me on a default schedule.
          </label>

          <label>
            <input type="checkbox" data-after="stop"
              ${after==='stop'?'checked':''}>
            After the final day, don't remind me anymore on this assignment.
          </label>
        </div>

        <button type="button" id="r_disable"
          style="color:#dc2626;font-weight:700">
          Don't remind me on this assignment
        </button>

        <button type="button" class="pri" id="r_continue">
          Continue
        </button>

        <button type="button" class="danger" id="r_cancel">
          Cancel
        </button>`;

      box.querySelectorAll('[data-mode]').forEach(button=>{
        button.onclick=()=>{
          mode=button.dataset.mode;
          draw();
        };
      });

      const hour=box.querySelector('#r_hour');
      const minute=box.querySelector('#r_minute');
      const period=box.querySelector('#r_period');

      if(hour&&minute&&period){
        [hour,minute,period].forEach(select=>{
          select.onchange=()=>{
            reminder.time=to24Hour(hour.value,minute.value,period.value);
          };
        });
      }

      const datesBox=box.querySelector('#r_dates');

      if(datesBox){
        datesBox.innerHTML=dates.length
          ?dates.map(date=>`
              <div class="small">
                ${esc(prettyDate(date))}
                <button type="button" data-remove-date="${esc(date)}">
                  Remove
                </button>
              </div>
            `).join('')
          :'<p class="small">No custom dates selected yet.</p>';

        box.querySelectorAll('[data-remove-date]').forEach(button=>{
          button.onclick=()=>{
            dates=dates.filter(date=>date!==button.dataset.removeDate);
            draw();
          };
        });

        box.querySelector('#r_add_date').onclick=()=>{
          const input=box.querySelector('#r_date');

          if(input.value&&!dates.includes(input.value)){
            dates.push(input.value);
            dates.sort();
            draw();
          }else{
            input.focus();
          }
        };
      }

      box.querySelectorAll('[data-after]').forEach(checkbox=>{
        checkbox.onchange=()=>{
          after=checkbox.checked?checkbox.dataset.after:null;

          box.querySelectorAll('[data-after]').forEach(option=>{
            option.checked=option.dataset.after===after;
          });

          updateContinue();
        };
      });

      const updateContinue=()=>{
        const valid=mode==='default'||(dates.length>0&&after!==null);

        box.querySelector('#r_continue').disabled=!valid;
      };

      updateContinue();

      box.querySelector('#r_disable').onclick=()=>{
        const confirmed=confirm(
          "Is this what you want? You won't get reminders on this assignment."
        );

        if(confirmed){
          close({...reminder,enabled:false,mode,dates,after});
        }
      };

      box.querySelector('#r_continue').onclick=()=>{
        if(mode==='custom'&&(!dates.length||after===null))return;

        close({
          enabled:true,
          mode,
          time:reminder.time,
          dates:mode==='custom'?dates:[],
          after:mode==='custom'?after:'default'
        });
      };

      box.querySelector('#r_cancel').onclick=()=>close(null);
    };

    draw();
  });
}
/* ---------- classes ---------- */
async function addClass(){
  const name=await ask('Class name','e.g. Calculus');
  if(!name)return;

  const category=await choose('Which category is "'+name+'"?',[
    {label:'Academic',value:'academic',cls:'pri'},
    {label:'Other (sports, chess, clubs...)',value:'other'}
  ]);
  if(!category)return;

  S.classes.push({id:uid(),name,cat:category});
  save();
  render();
}

async function manageClasses(){
  await modal((box,close)=>{
    const draw=()=>{
      box.innerHTML='<h3>Your classes</h3>'+(S.classes.length?'':'<p class="small">No classes yet.</p>');

      S.classes.forEach(item=>{
        const button=document.createElement('button');
        button.innerHTML=`<span class="chip ${item.cat==='academic'?'academic':'other'}">${item.cat==='academic'?'Academic':'Other'}</span> ${esc(item.name)}`;
        button.onclick=async()=>{
          const action=await choose(item.name,[
            {label:'Rename',value:'r'},
            {label:'Change category',value:'c'},
            {label:'Delete',value:'d',cls:'danger'}
          ]);

          if(action==='r'){
            const newName=await ask('Rename class','Class name',item.name);
            if(newName)item.name=newName;
          }
          if(action==='c'){
            const newCategory=await choose('Category for '+item.name,[
              {label:'Academic',value:'academic'},
              {label:'Other',value:'other'}
            ]);
            if(newCategory)item.cat=newCategory;
          }
          if(action==='d'&&confirm('Delete '+item.name+'? Its assignments stay but lose their class.')){
            S.classes=S.classes.filter(existing=>existing!==item);
          }

          save();
          draw();
          render();
        };
        box.appendChild(button);
      });

      const add=document.createElement('button');
      add.className='pri';
      add.textContent='+ Add class';
      add.onclick=async()=>{await addClass();draw()};

      const done=document.createElement('button');
      done.textContent='Done';
      done.onclick=()=>close(1);
      box.append(add,done);
    };

    draw();
  });
}

/* ---------- new assignment wizard ---------- */
async function newAssignment(){
  if(!S.classes.length){
    toast('Add a class first!');
    await addClass();
    if(!S.classes.length)return;
  }

  const title=await ask('Assignment title','e.g. Calculus unit test');
  if(!title)return;

  const classId=await choose(
    'Which class is this for?',
    S.classes.map(item=>({
      label:item.name+(item.cat==='other'?'  (other)':''),
      value:item.id
    }))
  );
  if(!classId)return;

  const type=await choose(
    'What type of assignment is this?',
    Object.entries(TYPES).map(([value,label])=>({label,value}))
  );
  if(!type)return;

  let subtitle='';
  if(type==='project'||type==='other'){
    const value=await ask('Give it a subtitle','e.g. Poster, Lab report, Chess tournament');
    if(!value)return;
    subtitle=value;
  }

    const dueChoice=await dateModal('');
  if(!dueChoice)return;

  const due=dueChoice==='NA'||dueChoice==='CUSTOM'?null:dueChoice;

  const initialReminder=normalizeReminder({
    reminder:{
      mode:dueChoice==='CUSTOM'?'custom':'default',
      time:S.settings.time||'16:00'
    }
  },S.settings.time||'16:00');

  const reminder=await reminderModal(initialReminder);
  if(!reminder)return;

    const assignment={
    id:uid(),
    title,
    classId,
    type,
    subtitle,
    due,
    reminder,
    notes:'',
    done:false,
    last:''
  };
  S.assignments.push(assignment);

  save();
  scheduleDigestAssignment(assignment).catch(error=>toast(error.message));
  view='list';
  filter='active';
  render();
  toast('Added! Reminders are set.');
  checkReminders();
}

<label><input type="checkbox" id="e_n" ${assignment.due?'':'checked'}> No due date</label>

      assignment.last='';
      save();
            if(!assignment.done){
        scheduleDigestAssignment(assignment).catch(error=>toast(error.message));
      }
      close(1);
      render();
      toast('Saved');
      checkReminders();
    };

         assignment.done=!assignment.done;
      assignment.last='';
      save();
      if(assignment.done){
        deleteDigestAssignment(assignment.id).catch(error=>toast(error.message));
      }else{
        scheduleDigestAssignment(assignment).catch(error=>toast(error.message));
      }

    get('e_del').onclick=()=>{
      if(confirm('Delete this assignment?')){
        S.assignments=S.assignments.filter(item=>item!==assignment);
        deleteDigestAssignment(assignment.id).catch(error=>toast(error.message));
        save();
        close(1);
        render();
      }
    };

    get('e_x').onclick=()=>close(null);

/* ---------- reminders ---------- */
function fire(title,body){
  toast(body);
  if(!('Notification' in window)||Notification.permission!=='granted')return;

  const fallback=()=>{
    try{new Notification(title,{body})}catch(e){}
  };

  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration()
      .then(registration=>{
        if(registration)registration.showNotification(title,{body});
        else fallback();
      })
      .catch(fallback);
  }else{
    fallback();
  }
}

function message(assignment){
  const name=S.settings.name||'friend';
  const classItem=cls(assignment.classId);
  const days=daysUntil(assignment.due);
  const className=classItem?` (${classItem.name})`:'';
  const when=days===null?'':days===0?'today':days===1?'tomorrow':`in ${days} days`;
  const subtitle=assignment.subtitle?` – ${assignment.subtitle}`:'';

  if(days===null){
    return `Reminder, ${name}: ${assignment.title}${subtitle}${className}. Turn this off in the app when it's done.`;
  }

  switch(assignment.type){
    case 'test':
      return `Study, ${name}! You need time to study the unit review for ${assignment.title}${className}. Test ${when}.`;
    case 'quiz':
      return `Quiz ${when}: ${assignment.title}${className}. Take 20 minutes to review, ${name}.`;
    case 'homework':
      return `Homework due ${when}: ${assignment.title}${className}. Knock it out, ${name}.`;
    case 'project':
      return `Work on your project "${assignment.title}"${subtitle}${className}. Due ${when}.`;
    default:
      return `${assignment.title}${subtitle}${className}: due ${when}.`;
  }
}

function defaultScheduleApplies(assignment){
  const days=daysUntil(assignment.due);
  return days===null||(days>=0&&days<=(WINDOW[assignment.type]||3));
}

function reminderAppliesToday(assignment,today){
  const reminder=normalizeReminder(
    assignment,
    S.settings.time||'16:00'
  );

  if(assignment.done||!reminder.enabled)return false;

  if(reminder.mode!=='custom'){
    return defaultScheduleApplies(assignment);
  }

  if(reminder.dates.includes(today))return true;

  const finalDate=reminder.dates[reminder.dates.length-1];
  if(!finalDate||today<=finalDate)return false;

  if(reminder.after==='daily')return true;
  if(reminder.after==='default')return defaultScheduleApplies(assignment);
  return false;
}

function reminderTimeHasPassed(assignment){
  const reminder=normalizeReminder(
    assignment,
    S.settings.time||'16:00'
  );

  const [hour,minute]=reminder.time.split(':').map(Number);
  const now=new Date();
  return now.getHours()*60+now.getMinutes()>=hour*60+minute;
}

function dueToday(){
  const today=todayStr();

  return S.assignments
    .filter(assignment=>reminderAppliesToday(assignment,today))
    .map(assignment=>({
      a:assignment,
      past:reminderTimeHasPassed(assignment)
    }));
}

function checkReminders(){
  const today=todayStr();
  let changed=false;

  dueToday().forEach(({a,past})=>{
    if(past&&a.last!==today){
      a.last=today;
      changed=true;
      fire((S.settings.name||'My')+"'s Planner",message(a));
    }
  });

  if(changed)save();
}

function zippySpeak(messageText){
  const dock=document.getElementById('zippy-dock');
  const bubble=document.getElementById('zippy-bubble');
  if(!dock||!bubble)return;

  updateZippy();
  bubble.textContent=messageText;
  bubble.hidden=false;

  const cheer=Number(S.settings.cheer??3);
  dock.style.setProperty('--zippy-bounce-duration',Math.max(.3,.9-cheer*.12)+'s');
  dock.classList.remove('is-speaking');
  void dock.offsetWidth;
  dock.classList.add('is-speaking');

  clearTimeout(zippyTimer);
  zippyTimer=setTimeout(()=>{
    bubble.hidden=true;
    dock.classList.remove('is-speaking');
  },4500);
}

function toast(messageText){
  const container=document.getElementById('toasts');
  if(!container)return;

  const element=document.createElement('div');
  element.className='toast';
  element.textContent=messageText;
  container.appendChild(element);
  setTimeout(()=>element.remove(),6000);
  zippySpeak(messageText);
}

function playZippySmack(){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;

    const context=new AudioContextClass();
    const oscillator=context.createOscillator();
    const volume=context.createGain();

    oscillator.type='triangle';
    oscillator.frequency.setValueAtTime(190,context.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(65,context.currentTime+.12);
    volume.gain.setValueAtTime(.35,context.currentTime);
    volume.gain.exponentialRampToValueAtTime(.001,context.currentTime+.16);

    oscillator.connect(volume);
    volume.connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime+.16);
    oscillator.onended=()=>context.close();
  }catch(error){}
}

  const raisedHand=document.createElement('div');
raisedHand.className='hf-raised-hand';
raisedHand.textContent='✋';
raisedHand.setAttribute('role','button');
raisedHand.setAttribute('tabindex','0');
raisedHand.setAttribute('aria-label','Give Zippy a high five');

  const thumb=document.createElement('div');
  thumb.className='hf-thumb';
  thumb.textContent='👍';
  thumb.setAttribute('aria-hidden','true');

  const hit=document.createElement('div');
  hit.className='hf-hit';
  hit.textContent='SMACK!';
  hit.setAttribute('aria-hidden','true');

  stage.append(caption,flames,cracks,flash,buddy,raisedHand,thumb,hit);
  document.body.classList.add('zippy-highfive-active');
  document.body.appendChild(stage);

  return {stage,caption,buddy,raisedHand};
}

async function startZippyHighFive(){
  const dramatic=Number(S.settings.cheer||0)>=3;
  const {stage,caption,buddy,raisedHand}=makeHighFiveStage(dramatic);
  let finished=false;

    const doHighFive=async()=>{
    if(finished)return;
    finished=true;
    raisedHand.remove();

    if(!dramatic){
      stage.classList.add('smacked');
      playZippySmack();
      await waitForZippy(800);
      stage.classList.add('returning');
      await waitForZippy(850);
      stage.remove();
      document.body.classList.remove('zippy-highfive-active');
      zippySpeak("You're doing good");
      return;
    }

    stage.classList.add('cracked','explosion');
    playZippySmack();
    await waitForZippy(1800);

    caption.textContent=
      'You are doing SPECTACULARLY '+
      (S.settings.name||'friend')+
      '!!! You DESERVED that HIGH-FIVE!!!!!';

    stage.classList.add('show-thumb');
    await waitForZippy(3200);

    stage.classList.add('returning');
    await waitForZippy(850);
    stage.remove();
    document.body.classList.remove('zippy-highfive-active');
  };

buddy.onclick=doHighFive;

const tapHighFiveHand=()=>{
  raisedHand.remove();
  doHighFive();
};

raisedHand.onclick=tapHighFiveHand;
raisedHand.onkeydown=event=>{
  if(event.key==='Enter'||event.key===' '){
    event.preventDefault();
    tapHighFiveHand();
  }
};

}
  
function openZippyMenu(){
  zippySpeak(
    `Hi!! I'm ${S.settings.buddyName||'Zippy'}! What would you like to do?`
  );
  zippyMenu();
}
  
/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const active=S.assignments.filter(assignment=>!assignment.done);

  if(view==='home'){
    const focus=dueToday();
    const categories={
      academic:S.classes.filter(item=>item.cat==='academic'),
      other:S.classes.filter(item=>item.cat==='other')
    };

    app.innerHTML=`
    <div class="top">
      <div>
        <h1>${esc(S.settings.name||'Your')}'s Planner</h1>
        <div class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
      </div>
      <button class="ghost" id="b_set">⚙ Settings</button>
    </div>
    ${focus.length?`<div class="card"><h2>🔔 On your radar</h2>${focus.map(({a})=>`<div class="small" style="margin-bottom:6px;color:#111">${esc(message(a))}</div>`).join('')}</div>`:''}
    <button class="pri big" id="b_new">＋ New assignment</button>
<button class="big" id="b_list">📋 My assignments (${active.length} active)</button>    <div class="card">
      <h2>Academic classes</h2>
      ${categories.academic.map(item=>`<span class="chip academic">${esc(item.name)}</span>`).join('')||'<span class="small">None yet</span>'}
      <h2 style="margin-top:12px">Other (sports, chess, clubs)</h2>
      ${categories.other.map(item=>`<span class="chip other">${esc(item.name)}</span>`).join('')||'<span class="small">None yet</span>'}
      <div class="row" style="margin-top:12px">
        <button id="b_addc">+ Add class</button>
        <button id="b_manc">Edit classes</button>
      </div>
    </div>`;

    q('b_set').onclick=settingsModal;
    q('b_new').onclick=newAssignment;
    q('b_list').onclick=()=>{view='list';render()};
    q('b_addc').onclick=addClass;
    q('b_manc').onclick=manageClasses;
    return;
  }

  const list=S.assignments.filter(assignment=>
    filter==='all'||(filter==='done'?assignment.done:!assignment.done)
  );
  list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));

  app.innerHTML=`
  <div class="top">
    <h1>My assignments</h1>
    <button class="ghost" id="b_home">← Home</button>
  </div>
  <div class="tabs">
    ${['active','done','all'].map(value=>`<button data-f="${value}" class="${filter===value?'on':''}">${value[0].toUpperCase()+value.slice(1)}</button>`).join('')}
  </div>
  <button class="pri big" id="b_new">＋ New assignment</button>
  ${list.map(assignment=>{
    const classItem=cls(assignment.classId);
    const days=daysUntil(assignment.due);
    const due=assignment.due?prettyDate(assignment.due):'No due date (daily reminders)';
    let status='';

    if(days!==null&&!assignment.done){
      status=days<0
        ?`<span class="late">Overdue by ${-days}d</span>`
        :days===0
          ?'<span class="soon">Due today</span>'
          :days<=3
            ?`<span class="soon">${days}d left</span>`
            :`${days}d left`;
    }

    const typeLabel=TYPES[assignment.type]||'Other';
    const typeClass=TYPES[assignment.type]?assignment.type:'other';

    return `<div class="card asg ${assignment.done?'done':''}" data-id="${esc(assignment.id)}">
      <div class="title">${assignment.done?'✓ ':''}${esc(assignment.title)}</div>
      <div>
        <span class="chip t-${typeClass}">${typeLabel}${assignment.subtitle?': '+esc(assignment.subtitle):''}</span>
        ${classItem?`<span class="chip ${classItem.cat==='academic'?'academic':'other'}">${esc(classItem.name)}</span>`:''}
      </div>
      <div class="small">${esc(due)} ${status}</div>
      ${assignment.notes?`<div class="small" style="margin-top:6px">📝 ${esc(assignment.notes)}</div>`:''}
    </div>`;
  }).join('')||'<div class="card empty">Nothing here yet.</div>'}`;

  q('b_home').onclick=()=>{view='home';render()};
  q('b_new').onclick=newAssignment;
  app.querySelectorAll('[data-f]').forEach(button=>{
    button.onclick=()=>{filter=button.dataset.f;render()};
  });
  app.querySelectorAll('.asg').forEach(element=>{
    element.onclick=()=>editAssignment(element.dataset.id);
  });
}

function q(id){return document.getElementById(id)}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

async function ensureName(){
  while(!S.settings.name){
    const name=await modal((box,close)=>{
      box.innerHTML=`<h3>Welcome! 👋 What's your name?</h3><p class="small">I'll use it in your reminders.</p><input type="text" placeholder="Your name"><button class="pri">Let's go</button>`;
      const input=box.querySelector('input');
      const button=box.querySelector('button');
      const submit=()=>{
        const value=input.value.trim();
        if(value)close(value);
        else input.focus();
      };
      button.onclick=submit;
      input.addEventListener('keydown',event=>{
        if(event.key==='Enter')submit();
      });
      setTimeout(()=>input.focus(),50);
    });

    if(name){
      S.settings.name=name;
      save();
    }
  }
}

applyFont();
updateZippy();
q('zippy-face').onclick=openZippyMenu;
applyWall();
ensureName().then(async()=>{
  let tourAlreadyComplete=false;
  try{
    tourAlreadyComplete=localStorage.getItem(ZIPPY_TOUR_KEY)==='yes';
  }catch(error){}

  if(!tourAlreadyComplete){
    await startZippyTour();
  }

  render();
  checkReminders();
});
setInterval(checkReminders,60000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    render();
    checkReminders();
  }
});
</script>
