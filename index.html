<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Study Planner</title>
<style>
:root{--ink:#1b1b2f;--glass:rgba(255,255,255,.88);--acc:#4f46e5;--acc2:#ec4899;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,#6366f1,#ec4899)}
#app{max-width:640px;margin:0 auto;padding:16px 14px 100px}
h1{margin:0;font-size:26px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
h2{font-size:18px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.sub{color:#fff;opacity:.95;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.card{background:var(--glass);backdrop-filter:blur(8px);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:#e5e7eb;color:var(--ink)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600}
button.big{width:100%;padding:16px;font-size:17px;margin-bottom:10px}
button.ghost{background:rgba(255,255,255,.25);color:#fff}
button.danger{background:#fee2e2;color:var(--bad)}
button.ok{background:#dcfce7;color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;margin:3px 4px 3px 0;color:#fff}
.academic{background:#4f46e5}.other{background:#ea580c}
.t-test{background:#dc2626}.t-quiz{background:#d97706}.t-homework{background:#2563eb}.t-project{background:#7c3aed}.t-other{background:#6b7280}
.asg{cursor:pointer}
.asg.done{opacity:.55}
.asg .title{font-weight:700;font-size:16px}
.small{font-size:13px;color:#4b5563}
.late{color:var(--bad);font-weight:700}
.soon{color:#b45309;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.box h3{margin:0 0 12px}
.box button{width:100%;margin-bottom:8px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:10px;background:#fff}
textarea{min-height:90px}
label{font-size:13px;color:#4b5563;display:block;margin-bottom:3px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:rgba(255,255,255,.35);color:#fff}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.walls button{height:50px;padding:0;margin:0;border:2px solid #fff;box-shadow:0 0 0 1px #d1d5db}
#toasts{position:fixed;left:0;right:0;top:10px;z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:14px;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto}
.empty{text-align:center;color:#4b5563;padding:10px}
.zippy-dock{position:fixed;right:18px;bottom:18px;z-index:45;display:flex;align-items:flex-end;gap:10px}
.zippy-face{width:76px;height:76px;padding:0;border:4px solid #111;border-radius:50%;display:grid;place-items:center;font-size:42px;box-shadow:0 6px 18px #0004}
.zippy-bubble{max-width:min(260px,calc(100vw - 130px));padding:12px 14px;border:2px solid #111;border-radius:16px;background:#fff;color:#111;box-shadow:0 6px 18px #0003;font-size:14px}
.zippy-bubble[hidden]{display:none}
.zippy-dock.is-speaking .zippy-face{animation:zippy-bounce var(--zippy-bounce-duration,.55s) ease-in-out 2}
@keyframes zippy-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px) rotate(-5deg)}}
@media(prefers-reduced-motion:reduce){.zippy-dock.is-speaking .zippy-face{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div class="zippy-dock" id="zippy-dock">
  <div class="zippy-bubble" id="zippy-bubble" role="status" hidden></div>
  <button class="zippy-face" id="zippy-face" type="button" aria-label="Talk to Zippy">😀</button>
</div>
<script>
'use strict';

const KEY='gabe-planner-v1';
const SYNC_KEY='gabe-planner-sync';
const TYPES={test:'Test',quiz:'Quiz',homework:'Homework',project:'Special project',other:'Other'};
const WINDOW={test:7,quiz:4,project:10,homework:2,other:3};
const WALLS=[
  ['Sunset','linear-gradient(135deg,#6366f1,#ec4899)'],
  ['Ocean','linear-gradient(135deg,#0ea5e9,#14b8a6)'],
  ['Forest','linear-gradient(135deg,#16a34a,#065f46)'],
  ['Fire','linear-gradient(135deg,#f97316,#dc2626)'],
  ['Night','linear-gradient(135deg,#1e1b4b,#4338ca)'],
  ['Candy','linear-gradient(135deg,#f472b6,#a78bfa)'],
  ['Lime','linear-gradient(135deg,#a3e635,#22d3ee)'],
  ['Slate','linear-gradient(135deg,#334155,#0f172a)']
];

function defaultData(){
  return {
    classes:[],
    assignments:[],
    settings:{
      wall:{type:'css',value:WALLS[0][1]},
      time:'16:00',
      buddyName:'Zippy',
      buddyColor:'#ffd84d',
      buddyDesign:'😀',
      cheer:3
    }
  };
}

function normalizeData(data){
  const defaults=defaultData();
  const source=data&&typeof data==='object'?data:{};
  const settings=source.settings&&typeof source.settings==='object'?source.settings:{};
  return {
    ...source,
    classes:Array.isArray(source.classes)?source.classes:[],
    assignments:Array.isArray(source.assignments)?source.assignments:[],
    settings:{
      ...defaults.settings,
      ...settings,
      wall:settings.wall&&typeof settings.wall==='object'?settings.wall:defaults.settings.wall,
      time:settings.time||defaults.settings.time,
      buddyName:settings.buddyName||defaults.settings.buddyName,
      buddyColor:settings.buddyColor||defaults.settings.buddyColor,
      buddyDesign:settings.buddyDesign||defaults.settings.buddyDesign,
      cheer:Number.isFinite(Number(settings.cheer))?Number(settings.cheer):defaults.settings.cheer
    }
  };
}

function load(){
  try{
    const stored=JSON.parse(localStorage.getItem(KEY));
    if(stored&&Array.isArray(stored.classes))return normalizeData(stored);
  }catch(e){}
  return defaultData();
}

let S=load();
let view='home';
let filter='active';
let syncTimer;
let zippyTimer;

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){
    toast('Could not save (storage full?). Try a smaller wallpaper.');
  }
  scheduleSync();
}

/* ---------- GitHub sync ---------- */
function syncCfg(){
  try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}
  catch(e){return {}}
}

function scheduleSync(){
  const cfg=syncCfg();
  if(!cfg.repo||!cfg.token)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false),1500);
}

async function syncNow(verbose){
  const cfg=syncCfg();
  if(!cfg.repo||!cfg.token){
    if(verbose)toast('Add your repo and token in Settings first.');
    return;
  }

  const url=`https://api.github.com/repos/${cfg.repo}/contents/assignments.json`;
  const headers={
    Authorization:'Bearer '+cfg.token,
    Accept:'application/vnd.github+json'
  };

  try{
    let sha;
    const getResponse=await fetch(url,{headers});
    if(getResponse.ok){
      sha=(await getResponse.json()).sha;
    }else if(getResponse.status!==404){
      throw new Error('GitHub said '+getResponse.status+' (check repo name and token)');
    }

    const data={
      name:S.settings.name,
      classes:S.classes,
      assignments:S.assignments,
      settings:{time:S.settings.time},
      updated:new Date().toISOString()
    };
    const body={
      message:'Sync planner',
      content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))
    };
    if(sha)body.sha=sha;

    const putResponse=await fetch(url,{
      method:'PUT',
      headers,
      body:JSON.stringify(body)
    });
    if(!putResponse.ok){
      throw new Error('GitHub said '+putResponse.status+' (token needs Contents: read & write)');
    }
    if(verbose)toast('Synced to GitHub ✓');
  }catch(e){
    toast('Sync failed: '+e.message);
  }
}

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[char]));

function todayStr(){
  const date=new Date();
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}

function daysUntil(due){
  if(!due)return null;
  return Math.round((new Date(due+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
}

function cls(id){return S.classes.find(item=>item.id===id)}

function prettyDate(date){
  return new Date(date+'T00:00:00').toLocaleDateString(undefined,{
    weekday:'short',
    month:'short',
    day:'numeric'
  });
}

/* ---------- wallpaper ---------- */
function applyWall(){
  const wall=S.settings.wall||{type:'css',value:WALLS[0][1]};
  if(wall.type==='image'){
    document.body.style.background=`url("${wall.value}") center/cover fixed`;
  }else{
    document.body.style.background=wall.value||WALLS[0][1];
  }
}

/* ---------- modals ---------- */
function modal(build){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');
    overlay.className='overlay';
    const box=document.createElement('div');
    box.className='box';
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    let closed=false;
    const close=value=>{
      if(closed)return;
      closed=true;
      overlay.remove();
      resolve(value);
    };

    overlay.addEventListener('click',event=>{
      if(event.target===overlay)close(null);
    });
    build(box,close);
  });
}

function choose(title,options){
  return modal((box,close)=>{
    box.innerHTML=`<h3>${esc(title)}</h3>`;
    options.forEach(option=>{
      const button=document.createElement('button');
      button.textContent=option.label;
      if(option.cls)button.className=option.cls;
      button.onclick=()=>close(option.value);
      box.appendChild(button);
    });
    const cancel=document.createElement('button');
    cancel.textContent='Cancel';
    cancel.className='danger';
    cancel.onclick=()=>close(null);
    box.appendChild(cancel);
  });
}

function ask(title,placeholder,initial=''){
  return modal((box,close)=>{
    box.innerHTML=`<h3>${esc(title)}</h3><input type="text" placeholder="${esc(placeholder)}" value="${esc(initial)}"><button class="pri">OK</button><button class="danger">Cancel</button>`;
    const input=box.querySelector('input');
    const [ok,cancel]=box.querySelectorAll('button');

    const submit=()=>{
      const value=input.value.trim();
      if(value)close(value);
      else input.focus();
    };

    ok.onclick=submit;
    cancel.onclick=()=>close(null);
    input.addEventListener('keydown',event=>{
      if(event.key==='Enter')submit();
    });
    setTimeout(()=>input.focus(),50);
  });
}

function dateModal(initial){
  return modal((box,close)=>{
    box.innerHTML=`<h3>When is it due?</h3><input type="date" value="${esc(initial||'')}"><button class="pri">Save date</button><button class="ok">N/A: remind me daily until I turn it off</button><button class="danger">Cancel</button>`;
    const input=box.querySelector('input');
    const [saveDate,noDate,cancel]=box.querySelectorAll('button');
    saveDate.onclick=()=>{if(input.value)close(input.value);else input.focus()};
    noDate.onclick=()=>close('NA');
    cancel.onclick=()=>close(null);
  });
}

/* ---------- classes ---------- */
async function addClass(){
  const name=await ask('Class name','e.g. Calculus');
  if(!name)return;

  const category=await choose('Which category is "'+name+'"?',[
    {label:'Academic',value:'academic',cls:'pri'},
    {label:'Other (sports, chess, clubs...)',value:'other'}
  ]);
  if(!category)return;

  S.classes.push({id:uid(),name,cat:category});
  save();
  render();
}

async function manageClasses(){
  await modal((box,close)=>{
    const draw=()=>{
      box.innerHTML='<h3>Your classes</h3>'+(S.classes.length?'':'<p class="small">No classes yet.</p>');

      S.classes.forEach(item=>{
        const button=document.createElement('button');
        button.innerHTML=`<span class="chip ${item.cat==='academic'?'academic':'other'}">${item.cat==='academic'?'Academic':'Other'}</span> ${esc(item.name)}`;
        button.onclick=async()=>{
          const action=await choose(item.name,[
            {label:'Rename',value:'r'},
            {label:'Change category',value:'c'},
            {label:'Delete',value:'d',cls:'danger'}
          ]);

          if(action==='r'){
            const newName=await ask('Rename class','Class name',item.name);
            if(newName)item.name=newName;
          }
          if(action==='c'){
            const newCategory=await choose('Category for '+item.name,[
              {label:'Academic',value:'academic'},
              {label:'Other',value:'other'}
            ]);
            if(newCategory)item.cat=newCategory;
          }
          if(action==='d'&&confirm('Delete '+item.name+'? Its assignments stay but lose their class.')){
            S.classes=S.classes.filter(existing=>existing!==item);
          }

          save();
          draw();
          render();
        };
        box.appendChild(button);
      });

      const add=document.createElement('button');
      add.className='pri';
      add.textContent='+ Add class';
      add.onclick=async()=>{await addClass();draw()};

      const done=document.createElement('button');
      done.textContent='Done';
      done.onclick=()=>close(1);
      box.append(add,done);
    };

    draw();
  });
}

/* ---------- new assignment wizard ---------- */
async function newAssignment(){
  if(!S.classes.length){
    toast('Add a class first!');
    await addClass();
    if(!S.classes.length)return;
  }

  const title=await ask('Assignment title','e.g. Calculus unit test');
  if(!title)return;

  const classId=await choose(
    'Which class is this for?',
    S.classes.map(item=>({
      label:item.name+(item.cat==='other'?'  (other)':''),
      value:item.id
    }))
  );
  if(!classId)return;

  const type=await choose(
    'What type of assignment is this?',
    Object.entries(TYPES).map(([value,label])=>({label,value}))
  );
  if(!type)return;

  let subtitle='';
  if(type==='project'||type==='other'){
    const value=await ask('Give it a subtitle','e.g. Poster, Lab report, Chess tournament');
    if(!value)return;
    subtitle=value;
  }

  const due=await dateModal('');
  if(!due)return;

  S.assignments.push({
    id:uid(),
    title,
    classId,
    type,
    subtitle,
    due:due==='NA'?null:due,
    notes:'',
    done:false,
    last:''
  });

  save();
  view='list';
  filter='active';
  render();
  toast('Added! Reminders are set.');
  checkReminders();
}

/* ---------- edit assignment ---------- */
function editAssignment(id){
  const assignment=S.assignments.find(item=>item.id===id);
  if(!assignment)return;

  modal((box,close)=>{
    box.innerHTML=`<h3>Edit assignment</h3>
    <label>Title</label><input type="text" id="e_t" value="${esc(assignment.title)}">
    <label>Class</label><select id="e_c">${S.classes.map(item=>`<option value="${esc(item.id)}" ${item.id===assignment.classId?'selected':''}>${esc(item.name)}</option>`).join('')}</select>
    <label>Type</label><select id="e_y">${Object.entries(TYPES).map(([value,label])=>`<option value="${value}" ${value===assignment.type?'selected':''}>${label}</option>`).join('')}</select>
    <label>Subtitle (optional)</label><input type="text" id="e_s" value="${esc(assignment.subtitle||'')}">
    <label>Due date</label><input type="date" id="e_d" value="${esc(assignment.due||'')}">
    <label><input type="checkbox" id="e_n" ${assignment.due?'':'checked'}> No due date (remind me daily)</label>
    <label style="margin-top:10px">Notes / commentary</label><textarea id="e_o">${esc(assignment.notes||'')}</textarea>
    <button class="pri" id="e_save">Save</button>
    <button class="ok" id="e_done">${assignment.done?'Reactivate (turn reminders back on)':'Mark done (turn reminders off)'}</button>
    <button class="danger" id="e_del">Delete</button>
    <button id="e_x">Close</button>`;

    const get=id=>box.querySelector('#'+id);

    get('e_save').onclick=()=>{
      assignment.title=get('e_t').value.trim()||assignment.title;
      assignment.classId=get('e_c').value;
      assignment.type=get('e_y').value;
      assignment.subtitle=get('e_s').value.trim();
      assignment.due=get('e_n').checked?null:(get('e_d').value||null);
      assignment.notes=get('e_o').value;
      assignment.last='';
      save();
      close(1);
      render();
      toast('Saved');
      checkReminders();
    };

    get('e_done').onclick=()=>{
      assignment.done=!assignment.done;
      assignment.last='';
      save();
      close(1);
      render();
    };

    get('e_del').onclick=()=>{
      if(confirm('Delete this assignment?')){
        S.assignments=S.assignments.filter(item=>item!==assignment);
        save();
        close(1);
        render();
      }
    };

    get('e_x').onclick=()=>close(null);
  });
}

/* ---------- settings ---------- */
function settingsModal(){
  modal((box,close)=>{
    const permission=('Notification' in window)?Notification.permission:'unsupported';

    box.innerHTML=`<h3>Settings</h3>
    <label>Your name</label><input type="text" id="s_name" value="${esc(S.settings.name||'')}">
    <label>Zippy's name</label><input type="text" id="s_buddy" value="${esc(S.settings.buddyName)}">
    <label>Zippy's color</label><input type="color" id="s_buddy_color" value="${esc(S.settings.buddyColor)}">
    <label>Zippy's character</label>
    <select id="s_buddy_design">
      <option value="😀" ${S.settings.buddyDesign==='😀'?'selected':''}>Happy</option>
      <option value="🤓" ${S.settings.buddyDesign==='🤓'?'selected':''}>Smart</option>
      <option value="🦊" ${S.settings.buddyDesign==='🦊'?'selected':''}>Fox</option>
      <option value="🐻" ${S.settings.buddyDesign==='🐻'?'selected':''}>Bear</option>
    </select>
    <label>Zippy cheer level: <span id="s_cheer_value">${S.settings.cheer}</span></label>
    <input type="range" id="s_cheer" min="0" max="5" value="${S.settings.cheer}">
    <label>Wallpaper</label>
    <div class="walls">${WALLS.map((wall,index)=>`<button data-w="${index}" style="background:${wall[1]}" title="${wall[0]}" aria-label="${wall[0]}"></button>`).join('')}</div>
    <label>Custom color</label><input type="color" id="s_col" style="width:100%;height:44px;border:0;margin-bottom:10px">
    <label>Your own picture</label><input type="file" accept="image/*" id="s_img" style="margin-bottom:10px">
    <label>Daily reminder time</label><input type="time" id="s_time" value="${esc(S.settings.time)}">
    <label>GitHub sync: your repo (username/repo-name)</label><input type="text" id="s_repo" placeholder="yourname/planner" value="${esc(syncCfg().repo||'')}">
    <label>GitHub token</label><input type="password" id="s_tok" placeholder="paste token" value="${esc(syncCfg().token||'')}">
    <button id="s_sync">Save &amp; sync now</button>
    <button id="s_export">Export Data</button>
    <button id="s_import">Import Data</button>
    <input type="file" id="s_file" accept="application/json,.json" hidden>
    <button id="s_n">Notifications: ${permission==='granted'?'ON ✓ (send a test)':'tap to enable'}</button>
    <button class="pri" id="s_ok">Done</button>`;

    const get=id=>box.querySelector('#'+id);

    box.querySelectorAll('[data-w]').forEach(button=>{
      button.onclick=()=>{
        S.settings.wall={type:'css',value:WALLS[Number(button.dataset.w)][1]};
        save();
        applyWall();
      };
    });

    get('s_col').oninput=event=>{
      S.settings.wall={type:'css',value:event.target.value};
      save();
      applyWall();
    };

    get('s_img').onchange=event=>{
      const file=event.target.files[0];
      if(!file)return;

      const reader=new FileReader();
      reader.onload=()=>{
        const image=new Image();
        image.onload=()=>{
          const maxSize=1400;
          const scale=Math.min(1,maxSize/Math.max(image.width,image.height));
          const canvas=document.createElement('canvas');
          canvas.width=Math.round(image.width*scale);
          canvas.height=Math.round(image.height*scale);
          canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
          S.settings.wall={
            type:'image',
            value:canvas.toDataURL('image/jpeg',.7)
          };
          save();
          applyWall();
        };
        image.src=reader.result;
      };
      reader.readAsDataURL(file);
    };

    get('s_name').onchange=event=>{
      const value=event.target.value.trim();
      if(value){
        S.settings.name=value;
        save();
        render();
      }
    };

    get('s_buddy').onchange=event=>{
      S.settings.buddyName=event.target.value.trim()||'Zippy';
      save();
      render();
      updateZippy();
    };

    get('s_buddy_color').oninput=event=>{
      S.settings.buddyColor=event.target.value;
      save();
      updateZippy();
    };

    get('s_buddy_design').onchange=event=>{
      S.settings.buddyDesign=event.target.value;
      save();
      updateZippy();
    };

    get('s_cheer').oninput=event=>{
      S.settings.cheer=Number(event.target.value);
      get('s_cheer_value').textContent=event.target.value;
      save();
    };

    get('s_time').onchange=event=>{
      S.settings.time=event.target.value||'16:00';
      save();
      checkReminders();
    };

    get('s_n').onclick=async()=>{
      if(!('Notification' in window)){
        toast('This browser does not support notifications.');
        return;
      }

      let state=Notification.permission;
      if(state!=='granted')state=await Notification.requestPermission();

      if(state==='granted'){
        fire((S.settings.name||'My')+"'s Planner",'Notifications are working! 🎉');
        get('s_n').textContent='Notifications: ON ✓ (send a test)';
      }else{
        toast('Notifications are blocked. Allow them in your browser/site settings.');
      }
    };

    get('s_sync').onclick=()=>{
      const repo=get('s_repo').value.trim()
        .replace(/^https?:\/\/github\.com\//,'')
        .replace(/\/$/,'');
      const token=get('s_tok').value.trim();

      try{
        localStorage.setItem(SYNC_KEY,JSON.stringify({repo,token}));
      }catch(e){
        toast('Could not save sync settings in this browser.');
        return;
      }
      syncNow(true);
    };

    get('s_export').onclick=()=>{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url;
      link.download='study-planner-backup.json';
      link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    };

    get('s_import').onclick=()=>get('s_file').click();

    get('s_file').onchange=event=>{
      const file=event.target.files[0];
      if(!file)return;

      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const imported=JSON.parse(reader.result);
          if(!imported||!Array.isArray(imported.classes)||!Array.isArray(imported.assignments)){
            throw new Error('The selected file is not a planner backup.');
          }
          if(!confirm('Import this backup? It will replace the planner data in this browser.')){
            event.target.value='';
            return;
          }

          S=normalizeData(imported);
          save();
          applyWall();
          updateZippy();
          close(1);
          render();
          toast('Data imported');
        }catch(error){
          toast('Import failed: '+error.message);
        }
      };
      reader.readAsText(file);
    };

    get('s_ok').onclick=()=>close(1);
  });
}

/* ---------- reminders ---------- */
function fire(title,body){
  toast(body);
  if(!('Notification' in window)||Notification.permission!=='granted')return;

  const fallback=()=>{
    try{new Notification(title,{body})}catch(e){}
  };

  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration()
      .then(registration=>{
        if(registration)registration.showNotification(title,{body});
        else fallback();
      })
      .catch(fallback);
  }else{
    fallback();
  }
}

function message(assignment){
  const name=S.settings.name||'friend';
  const classItem=cls(assignment.classId);
  const days=daysUntil(assignment.due);
  const className=classItem?` (${classItem.name})`:'';
  const when=days===null?'':days===0?'today':days===1?'tomorrow':`in ${days} days`;
  const subtitle=assignment.subtitle?` – ${assignment.subtitle}`:'';

  if(days===null){
    return `Reminder, ${name}: ${assignment.title}${subtitle}${className}. Turn this off in the app when it's done.`;
  }

  switch(assignment.type){
    case 'test':
      return `Study, ${name}! You need time to study the unit review for ${assignment.title}${className}. Test ${when}.`;
    case 'quiz':
      return `Quiz ${when}: ${assignment.title}${className}. Take 20 minutes to review, ${name}.`;
    case 'homework':
      return `Homework due ${when}: ${assignment.title}${className}. Knock it out, ${name}.`;
    case 'project':
      return `Work on your project "${assignment.title}"${subtitle}${className}. Due ${when}.`;
    default:
      return `${assignment.title}${subtitle}${className}: due ${when}.`;
  }
}

function dueToday(){
  const now=new Date();
  const [hour,minute]=(S.settings.time||'16:00').split(':').map(Number);
  const past=now.getHours()*60+now.getMinutes()>=hour*60+minute;

  return S.assignments
    .filter(assignment=>{
      if(assignment.done)return false;
      const days=daysUntil(assignment.due);
      return days===null||(days>=0&&days<=(WINDOW[assignment.type]||3));
    })
    .map(assignment=>({a:assignment,past}));
}

function checkReminders(){
  const today=todayStr();
  let changed=false;

  dueToday().forEach(({a,past})=>{
    if(past&&a.last!==today){
      a.last=today;
      changed=true;
      fire((S.settings.name||'My')+"'s Planner",message(a));
    }
  });

  if(changed)save();
}

/* ---------- Zippy ---------- */
function updateZippy(){
  const face=document.getElementById('zippy-face');
  if(!face)return;

  face.textContent=S.settings.buddyDesign||'😀';
  face.style.backgroundColor=S.settings.buddyColor||'#ffd84d';
  face.setAttribute('aria-label','Talk to '+(S.settings.buddyName||'Zippy'));
}

function zippySpeak(messageText){
  const dock=document.getElementById('zippy-dock');
  const bubble=document.getElementById('zippy-bubble');
  if(!dock||!bubble)return;

  updateZippy();
  bubble.textContent=messageText;
  bubble.hidden=false;

  const cheer=Number(S.settings.cheer??3);
  dock.style.setProperty('--zippy-bounce-duration',Math.max(.3,.9-cheer*.12)+'s');
  dock.classList.remove('is-speaking');
  void dock.offsetWidth;
  dock.classList.add('is-speaking');

  clearTimeout(zippyTimer);
  zippyTimer=setTimeout(()=>{
    bubble.hidden=true;
    dock.classList.remove('is-speaking');
  },4500);
}

function toast(messageText){
  const container=document.getElementById('toasts');
  if(!container)return;

  const element=document.createElement('div');
  element.className='toast';
  element.textContent=messageText;
  container.appendChild(element);
  setTimeout(()=>element.remove(),6000);
  zippySpeak(messageText);
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const active=S.assignments.filter(assignment=>!assignment.done);

  if(view==='home'){
    const focus=dueToday();
    const categories={
      academic:S.classes.filter(item=>item.cat==='academic'),
      other:S.classes.filter(item=>item.cat==='other')
    };

    app.innerHTML=`
    <div class="top">
      <div>
        <h1>${esc(S.settings.name||'Your')}'s Planner</h1>
        <div class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
      </div>
      <button class="ghost" id="b_set">⚙ Settings</button>
    </div>
    ${focus.length?`<div class="card"><h2>🔔 On your radar</h2>${focus.map(({a})=>`<div class="small" style="margin-bottom:6px;color:#111">${esc(message(a))}</div>`).join('')}</div>`:''}
    <button class="pri big" id="b_new">＋ New assignment</button>
    <button class="big" id="b_list">📋 My assignments (${active.length} active)</button>
    <div class="card">
      <h2>Academic classes</h2>
      ${categories.academic.map(item=>`<span class="chip academic">${esc(item.name)}</span>`).join('')||'<span class="small">None yet</span>'}
      <h2 style="margin-top:12px">Other (sports, chess, clubs)</h2>
      ${categories.other.map(item=>`<span class="chip other">${esc(item.name)}</span>`).join('')||'<span class="small">None yet</span>'}
      <div class="row" style="margin-top:12px">
        <button id="b_addc">+ Add class</button>
        <button id="b_manc">Edit classes</button>
      </div>
    </div>`;

    q('b_set').onclick=settingsModal;
    q('b_new').onclick=newAssignment;
    q('b_list').onclick=()=>{view='list';render()};
    q('b_addc').onclick=addClass;
    q('b_manc').onclick=manageClasses;
    return;
  }

  const list=S.assignments.filter(assignment=>
    filter==='all'||(filter==='done'?assignment.done:!assignment.done)
  );
  list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));

  app.innerHTML=`
  <div class="top">
    <h1>My assignments</h1>
    <button class="ghost" id="b_home">← Home</button>
  </div>
  <div class="tabs">
    ${['active','done','all'].map(value=>`<button data-f="${value}" class="${filter===value?'on':''}">${value[0].toUpperCase()+value.slice(1)}</button>`).join('')}
  </div>
  <button class="pri big" id="b_new">＋ New assignment</button>
  ${list.map(assignment=>{
    const classItem=cls(assignment.classId);
    const days=daysUntil(assignment.due);
    const due=assignment.due?prettyDate(assignment.due):'No due date (daily reminders)';
    let status='';

    if(days!==null&&!assignment.done){
      status=days<0
        ?`<span class="late">Overdue by ${-days}d</span>`
        :days===0
          ?'<span class="soon">Due today</span>'
          :days<=3
            ?`<span class="soon">${days}d left</span>`
            :`${days}d left`;
    }

    const typeLabel=TYPES[assignment.type]||'Other';
    const typeClass=TYPES[assignment.type]?assignment.type:'other';

    return `<div class="card asg ${assignment.done?'done':''}" data-id="${esc(assignment.id)}">
      <div class="title">${assignment.done?'✓ ':''}${esc(assignment.title)}</div>
      <div>
        <span class="chip t-${typeClass}">${typeLabel}${assignment.subtitle?': '+esc(assignment.subtitle):''}</span>
        ${classItem?`<span class="chip ${classItem.cat==='academic'?'academic':'other'}">${esc(classItem.name)}</span>`:''}
      </div>
      <div class="small">${esc(due)} ${status}</div>
      ${assignment.notes?`<div class="small" style="margin-top:6px">📝 ${esc(assignment.notes)}</div>`:''}
    </div>`;
  }).join('')||'<div class="card empty">Nothing here yet.</div>'}`;

  q('b_home').onclick=()=>{view='home';render()};
  q('b_new').onclick=newAssignment;
  app.querySelectorAll('[data-f]').forEach(button=>{
    button.onclick=()=>{filter=button.dataset.f;render()};
  });
  app.querySelectorAll('.asg').forEach(element=>{
    element.onclick=()=>editAssignment(element.dataset.id);
  });
}

function q(id){return document.getElementById(id)}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

async function ensureName(){
  while(!S.settings.name){
    const name=await modal((box,close)=>{
      box.innerHTML=`<h3>Welcome! 👋 What's your name?</h3><p class="small">I'll use it in your reminders.</p><input type="text" placeholder="Your name"><button class="pri">Let's go</button>`;
      const input=box.querySelector('input');
      const button=box.querySelector('button');
      const submit=()=>{
        const value=input.value.trim();
        if(value)close(value);
        else input.focus();
      };
      button.onclick=submit;
      input.addEventListener('keydown',event=>{
        if(event.key==='Enter')submit();
      });
      setTimeout(()=>input.focus(),50);
    });

    if(name){
      S.settings.name=name;
      save();
    }
  }
}

updateZippy();
q('zippy-face').onclick=()=>{
  zippySpeak(`Hi! I'm ${S.settings.buddyName||'Zippy'}—you've got this!`);
};
applyWall();
ensureName().then(()=>{
  render();
  checkReminders();
});
setInterval(checkReminders,60000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    render();
    checkReminders();
  }
});
</script>
